<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Base64 Encoder / Decoder — FileForge</title>
  <meta name="description" content="Encode text or files to Base64, or decode Base64 back to text or files. 100% private and offline."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .b64-layout { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:24px; }
    @media(max-width:800px) { .b64-layout { grid-template-columns:1fr; } }
    .b64-panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:16px; }
    .b64-panel h3 { font-size:1rem; font-weight:700; color:var(--text-1); margin:0; display:flex; justify-content:space-between; align-items:center; }
    .b64-textarea { width:100%; height:300px; padding:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text-1); font-family:monospace; font-size:0.9rem; resize:vertical; }
    .b64-textarea:focus { border-color:var(--accent); outline:none; }
    .b64-controls { display:flex; gap:12px; }
    .b64-btn { padding:8px 16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-2); font-size:0.85rem; font-weight:600; cursor:pointer; transition:all var(--transition); }
    .b64-btn:hover { background:var(--border); color:var(--text-1); }
    .b64-btn.primary { background:rgba(var(--accent-rgb),0.15); color:var(--accent); border-color:var(--accent); }
    .b64-btn.primary:hover { background:var(--accent); color:#fff; }
    .file-input-hidden { display:none; }
  </style>
</head>
<body class="page-wrapper">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><span>Base64 Encoder</span></nav>
      
      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">Base64 Encoder / Decoder</h1>
          <p class="tool-page-subtitle">Convert text or files to Base64, or decode Base64 strings. Safe, offline, instant.</p>
        </div>
      </div>

      <div class="b64-layout">
        
        <!-- Left Panel: Plain Text / File -->
        <div class="b64-panel">
          <h3>
            Input (Text / File)
            <button class="b64-btn" onclick="document.getElementById('fileInput').click()">📁 Open File</button>
          </h3>
          <input type="file" id="fileInput" class="file-input-hidden"/>
          <textarea id="textInput" class="b64-textarea" placeholder="Type or paste plain text here..."></textarea>
          <div class="b64-controls" style="justify-content:space-between;">
            <button class="b64-btn" id="clearTextBtn">Clear</button>
            <button class="b64-btn primary" id="encodeBtn">Encode to Base64 ➡️</button>
          </div>
        </div>

        <!-- Right Panel: Base64 String -->
        <div class="b64-panel">
          <h3>
            Base64 Output
            <button class="b64-btn" id="downloadFileBtn" style="display:none;">⬇️ Download Decoded File</button>
          </h3>
          <textarea id="base64Input" class="b64-textarea" placeholder="Type or paste Base64 encoded string here..."></textarea>
          <div class="b64-controls" style="justify-content:space-between;">
            <button class="b64-btn primary" id="decodeBtn">⬅️ Decode to Text</button>
            <div class="b64-controls">
              <button class="b64-btn" id="copyBtn">📋 Copy Base64</button>
              <button class="b64-btn" id="clearB64Btn">Clear</button>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/tools/base64Encoder.js"></script>
</body>
</html>
