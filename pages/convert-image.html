<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Convert Image Format — FileForge</title>
  <meta name="description" content="Convert images between JPG, PNG, and WEBP formats for free. Browser-based, private."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .format-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:20px; }
    .format-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .format-card-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .format-card-img { padding:12px; display:flex; align-items:center; justify-content:center; background:var(--bg); min-height:140px; }
    .format-card-img img { max-width:100%; max-height:120px; object-fit:contain; border-radius:4px; }
    .format-card-body { padding:12px 16px; }
    .format-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
    .badge-jpg { background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); }
    .badge-png { background:rgba(59,130,246,0.15); color:#3b82f6; border:1px solid rgba(59,130,246,0.3); }
    .badge-webp { background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.3); }
    .convert-arrow { text-align:center; font-size:1.4rem; color:var(--accent); margin:4px 0; }
    .size-info { font-size:0.75rem; color:var(--text-3); }
    .saving-tag { font-size:0.75rem; font-weight:700; color:#10b981; }
  </style>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Convert Image Format - File Forge",
  "url": "https://www.file-forge.dev/pages/convert-image",
  "description": "Convert between JPG, PNG, and WEBP formats. Batch convert multiple images at once.",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "All",
  "browserRequirements": "Requires JavaScript and modern browser support.",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "publisher": {
    "@id": "https://www.file-forge.dev/#organization"
  },
  "featureList": [
    "No server uploads required",
    "Processes files locally on device",
    "Completely free to use"
  ]
}
</script>
</head>
<body class="page-wrapper">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><span>Convert Image</span></nav>
      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21,15 16,10 5,21"/>
            <path d="M16 3l2 2-2 2M8 21l-2-2 2-2"/>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">Convert Image Format</h1>
          <p class="tool-page-subtitle">Convert between JPG, PNG, and WEBP formats. Batch convert multiple images at once.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple/>
        <span class="drop-zone-icon">🔄</span>
        <h3>Drop your images here</h3>
        <p>JPG · PNG · WEBP — convert multiple images at once</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse Images</button>
      </div>

      <div class="action-panel" id="actionPanel">
        <div class="options-row">
          <div class="option-group" style="flex:1;">
            <label for="targetFormat">Convert To</label>
            <select id="targetFormat">
              <option value="image/jpeg">JPG — Best for photos, smaller size</option>
              <option value="image/png">PNG — Lossless, supports transparency</option>
              <option value="image/webp" selected>WEBP — Modern format, best compression</option>
            </select>
          </div>
          <div class="option-group">
            <label for="convQuality">Quality</label>
            <select id="convQuality">
              <option value="0.7">70% — Smaller file</option>
              <option value="0.85" selected>85% — Balanced</option>
              <option value="0.95">95% — High quality</option>
              <option value="1">100% — Lossless</option>
            </select>
          </div>
        </div>

        <div class="format-grid" id="formatGrid"></div>

        <div class="result-panel" id="resultPanel" style="margin-top:20px;">
          <h4>✅ Conversion Complete!</h4>
          <p id="resultInfo"></p>
          <div class="result-actions">
            <button class="btn-primary" id="downloadAllBtn" style="width:auto">⬇️ Download All</button>
            <button class="btn-secondary" id="resetBtn">Convert More</button>
          </div>
        </div>
        <button class="btn-primary" id="convertBtn" style="margin-top:20px;">🔄 Convert Images</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/pdfUtils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../js/tools/convertImage.js"></script>
</body>
</html>
