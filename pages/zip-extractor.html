<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZIP Extractor — FileForge</title>
  <meta name="description" content="Extract files from ZIP archives directly in your browser. View contents and download individual files."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .zip-viewer { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-top:20px; }
    .zip-header { padding:16px 20px; border-bottom:1px solid var(--border); background:var(--surface-2); display:flex; justify-content:space-between; align-items:center; }
    .zip-stats { font-size:0.85rem; color:var(--text-3); }
    .zip-file-list { max-height:400px; overflow-y:auto; }
    .zip-item { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--border); transition:background 0.2s; }
    .zip-item:last-child { border-bottom:none; }
    .zip-item:hover { background:var(--bg); }
    .zip-item-info { display:flex; align-items:center; gap:12px; }
    .zip-icon { font-size:1.4rem; }
    .zip-name { font-weight:500; font-size:0.9rem; color:var(--text); word-break:break-all; }
    .zip-size { font-size:0.8rem; color:var(--text-3); }
    .zip-btn { padding:6px 12px; font-size:0.8rem; background:none; border:1px solid var(--border); border-radius:4px; color:var(--text); cursor:pointer; transition:all 0.2s; }
    .zip-btn:hover { border-color:var(--accent); color:var(--accent); }
    .zip-btn:disabled { opacity:0.5; cursor:not-allowed; }
  </style>
</head>
<body class="page-wrapper">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><span>ZIP Extractor</span></nav>
      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">ZIP Extractor</h1>
          <p class="tool-page-subtitle">View contents of ZIP files and download individual files locally.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".zip"/>
        <span class="drop-zone-icon">📦</span>
        <h3>Drop your ZIP file here</h3>
        <p>Extracts instantly without uploading</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse File</button>
      </div>

      <div class="action-panel" id="actionPanel">
        <div class="zip-viewer">
          <div class="zip-header">
            <span style="font-weight:600;color:var(--text);" id="zipTitle">archive.zip</span>
            <span class="zip-stats" id="zipStats">0 files</span>
          </div>
          <div class="zip-file-list" id="zipFileList"></div>
        </div>

        <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;">
          <button class="btn-primary" id="extractAllBtn">⬇️ Extract All (Save as Folder)</button>
          <button class="btn-secondary" id="resetBtn">Open Another ZIP</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/pdfUtils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../js/tools/zipExtractor.js"></script>
</body>
</html>
