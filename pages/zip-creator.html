<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZIP Creator — FileForge</title>
  <meta name="description" content="Create ZIP archives from multiple files securely in your browser."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body class="page-wrapper">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><span>ZIP Creator</span></nav>
      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(234,88,12,0.12);border:1px solid rgba(234,88,12,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline>
            <polyline points="7.5 19.79 7.5 14.6 3 12"></polyline>
            <polyline points="21 12 16.5 14.6 16.5 19.79"></polyline>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">ZIP Creator</h1>
          <p class="tool-page-subtitle">Select multiple files and compress them into a single ZIP archive.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" multiple/>
        <span class="drop-zone-icon">📦</span>
        <h3>Drop files here</h3>
        <p>Add any number of files to bundle together</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse Files</button>
      </div>

      <div class="action-panel" id="actionPanel" style="display:none;">
        <div class="options-row" style="margin-bottom:16px;">
          <div class="option-group" style="flex:1">
            <label for="zipName">Archive Name</label>
            <input type="text" id="zipName" value="Archive" placeholder="e.g. Photos"/>
          </div>
        </div>

        <div class="file-list" id="fileList"></div>
        <button class="btn-secondary" id="addMoreBtn" style="margin-top:10px;" onclick="document.getElementById('fileInput').click()">+ Add More Files</button>

        <div class="progress-wrap" id="progressWrap" style="margin-top:20px;display:none;">
          <div class="progress-label">
            <span class="msg" id="progressMsg">Zipping files...</span>
            <span class="pct" id="progressPct">0%</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        </div>

        <div class="result-panel" id="resultPanel" style="margin-top:20px;display:none;">
          <h4>✅ ZIP Created!</h4>
          <p id="resultInfo"></p>
          <div class="result-actions">
            <button class="btn-primary" id="downloadBtn" style="width:auto">⬇️ Download ZIP</button>
            <button class="btn-secondary" id="resetBtn">Create Another</button>
          </div>
        </div>

        <button class="btn-primary" id="zipBtn" style="margin-top:20px;">📦 Create ZIP Archive</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/pdfUtils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../js/tools/zipCreator.js"></script>
</body>
</html>
