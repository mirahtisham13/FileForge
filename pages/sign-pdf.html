<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign PDF — FileForge</title>
  <meta name="description" content="Digitally sign your PDF documents. Draw your signature and place it anywhere."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .editor-layout { display:grid; grid-template-columns:300px 1fr; gap:20px; margin-top:20px; }
    @media(max-width:800px) { .editor-layout { grid-template-columns:1fr; } }
    .sidebar { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:20px; }
    .pdf-viewport { background:var(--bg); padding:20px; border:1px solid var(--border); border-radius:var(--radius); overflow:auto; position:relative; min-height:500px; display:flex; justify-content:center; }
    #pdfCanvas { max-width:100%; box-shadow:0 4px 20px rgba(0,0,0,0.2); border-radius:4px; }
    
    .sig-pad-wrap { border:1px solid var(--border); background:#fff; border-radius:var(--radius-sm); position:relative; }
    #sigPad { width:100%; height:150px; cursor:crosshair; border-radius:var(--radius-sm); }
    .sig-actions { display:flex; justify-content:space-between; padding:8px; border-top:1px solid var(--border); background:var(--surface-2); }
    
    .overlay-sig { position:absolute; border:2px dashed var(--accent); cursor:move; user-select:none; z-index:10; }
    .overlay-sig img { width:100%; height:100%; pointer-events:none; }
    .resize-handle { position:absolute; bottom:-6px; right:-6px; width:12px; height:12px; background:var(--accent); border-radius:50%; cursor:se-resize; }
  </style>
</head>
<body class="page-wrapper">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><span>Sign PDF</span></nav>
      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">Sign PDF</h1>
          <p class="tool-page-subtitle">Draw your signature and stamp it anywhere on the document.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".pdf"/>
        <span class="drop-zone-icon">🖋️</span>
        <h3>Drop your PDF here</h3>
        <p>Private & secure — processed locally</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse File</button>
      </div>

      <div class="action-panel" id="actionPanel" style="display:none;padding:0;background:none;border:none;">
        <div class="editor-layout">
          <!-- Sidebar -->
          <div class="sidebar">
            <div>
              <p style="font-weight:600;margin-bottom:10px;">1. Draw Signature</p>
              <div class="sig-pad-wrap">
                <canvas id="sigPad"></canvas>
                <div class="sig-actions">
                  <button class="btn-secondary" id="clearSigBtn" style="padding:4px 8px;font-size:0.75rem;">Clear</button>
                  <button class="btn-primary" id="addSigBtn" style="padding:4px 8px;font-size:0.75rem;">Add to PDF</button>
                </div>
              </div>
            </div>

            <div>
              <p style="font-weight:600;margin-bottom:10px;">2. Page Navigation</p>
              <div style="display:flex;gap:10px;align-items:center;">
                <button class="btn-secondary" id="prevPageBtn" style="flex:1;">◀ Prev</button>
                <span id="pageInfo" style="font-size:0.85rem;font-weight:600;min-width:60px;text-align:center;">1 / 1</span>
                <button class="btn-secondary" id="nextPageBtn" style="flex:1;">Next ▶</button>
              </div>
            </div>

            <div style="margin-top:auto;padding-top:20px;border-top:1px solid var(--border);">
              <p style="font-weight:600;margin-bottom:10px;">3. Export</p>
              <button class="btn-primary" id="savePdfBtn" style="width:100%;margin-bottom:10px;">💾 Save Signed PDF</button>
              <button class="btn-secondary" id="resetBtn" style="width:100%;">Close File</button>
            </div>
          </div>

          <!-- Viewport -->
          <div class="pdf-viewport" id="pdfViewport">
            <div style="position:relative;display:inline-block;" id="pdfWrapper">
              <canvas id="pdfCanvas"></canvas>
              <!-- Signature overlays will be injected here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="../js/pdfUtils.js"></script>
  <script src="../js/tools/signPdf.js"></script>
</body>
</html>
