<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compress PDF — FileForge</title>
  <meta name="description" content="Compress and reduce PDF file size for free. Browser-based, private, no uploads needed."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body class="page-wrapper">

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <span class="breadcrumb-sep">›</span>
        <span>Compress PDF</span>
      </nav>

      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <path d="M9 15l3-3 3 3"/>
            <line x1="12" y1="12" x2="12" y2="17"/>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">Compress PDF</h1>
          <p class="tool-page-subtitle">Reduce your PDF file size while maintaining quality.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".pdf"/>
        <span class="drop-zone-icon">🗜️</span>
        <h3>Drop your PDF here</h3>
        <p>or click to browse — select one PDF file</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse File</button>
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="action-panel" id="actionPanel">
        <div class="options-row">
          <div class="option-group">
            <label for="quality">Compression Level</label>
            <select id="quality">
              <option value="high">High Quality (mild compression)</option>
              <option value="medium" selected>Balanced (recommended)</option>
              <option value="low">Max Compression (smaller size)</option>
            </select>
          </div>
        </div>
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-label">
            <span class="msg">Compressing PDF...</span>
            <span class="pct">0%</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        </div>
        <div class="result-panel" id="resultPanel">
          <h4>✅ Compression Complete!</h4>
          <p id="resultInfo">Your compressed PDF is ready.</p>
          <div class="result-actions">
            <button class="btn-primary" id="downloadBtn" style="width:auto">⬇️ Download Compressed PDF</button>
            <button class="btn-secondary" id="resetBtn">Compress Another</button>
          </div>
        </div>
        <button class="btn-primary" id="compressBtn">🗜️ Compress PDF</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/pdfUtils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="../js/tools/compress.js"></script>
</body>
</html>
