<body class="page-wrapper">

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <span class="breadcrumb-sep">›</span>
        <span>Split PDF</span>
      </nav>

      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);">
          <svg aria-hidden="true" focusable="false" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">Split PDF</h1>
          <p class="tool-page-subtitle">Extract specific pages or split a PDF into individual pages.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" aria-label="Upload file" accept=".pdf"/>
        <span class="drop-zone-icon">📄</span>
        <h3>Drop your PDF here</h3>
        <p>or click to browse — select one PDF file</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse File</button>
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="action-panel" id="actionPanel">
        <div class="options-row">
          <div class="option-group">
            <label for="splitMode">Split Mode</label>
            <select id="splitMode" aria-label="split mode">
              <option value="all">Split into individual pages</option>
              <option value="range">Extract page range</option>
            </select>
          </div>
          <div class="option-group" id="rangeGroup" style="display:none;">
            <label for="pageRange">Page Range (e.g. 1-3, 5, 7-9)</label>
            <input type="text" id="pageRange" aria-label="page range" placeholder="e.g. 1-3, 5, 7-9"/>
          </div>
        </div>
        <p class="page-info" id="pageInfo" style="font-size:0.85rem;color:var(--text-2);margin-bottom:16px;"></p>
        <div class="progress-wrap" id="progressWrap" aria-live="polite" aria-atomic="true">
          <div class="progress-label">
            <span class="msg">Splitting PDF...</span>
            <span class="pct">0%</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div></div>
        </div>
        <div class="result-panel" id="resultPanel">
          <h4>✅ Split Complete!</h4>
          <p id="resultInfo">Your files are ready.</p>
          <div class="result-actions">
            <button class="btn-primary" id="downloadBtn" style="width:auto">⬇️ Download Files</button>
            <button class="btn-secondary" id="resetBtn">Split Another</button>
          </div>
        </div>
        <button class="btn-primary" id="splitBtn">✂️ Split PDF</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/pdfUtils.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../js/tools/split.js"></script>

</html>
