<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blur Sensitive Info — FileForge</title>
  <meta name="description" content="Blur faces, license plates, or sensitive text in your images before sharing. 100% private."/>
  <meta name="theme-color" content="#6c63ff"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" href="../assets/icons/icon-192.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .blur-workspace {
      margin-top: 20px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
    }
    .blur-toolbar {
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2);
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }
    .blur-canvas-container {
      padding: 24px; background: var(--bg); display: flex; align-items: center; justify-content: center;
      min-height: 400px; cursor: crosshair; overflow: auto;
    }
    #blurCanvas {
      max-width: 100%; height: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border-radius: 4px;
    }
    .tool-btn {
      padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer; font-size: 0.85rem; font-weight: 500;
    }
    .tool-btn.active { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); color: var(--accent); }
    .slider-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-2); }
    .slider-wrap input { width: 100px; }
  </style>
</head>
<body class="page-wrapper">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" fill="url(#g1)" opacity="0.2"/>
            <path d="M6 4C6 2.895 6.895 2 8 2H18L24 8V24C24 25.105 23.105 26 22 26H8C6.895 26 6 25.105 6 24V4Z" stroke="url(#g1)" stroke-width="1.5"/>
            <path d="M18 2V8H24" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 13C14 13 12 15.5 12 17C12 18.105 12.895 19 14 19C15.105 19 16 18.105 16 17C16 15.5 14 13 14 13Z" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="6" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <span class="logo-text">File<span class="logo-accent">Forge</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-dark">🌙</span>
          <span class="theme-icon theme-icon-light">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="page-main">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">›</span><span>Blur Image</span></nav>
      <div class="tool-page-header">
        <div class="tool-page-icon" style="background:rgba(100,116,139,0.12);border:1px solid rgba(100,116,139,0.25);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"></path>
            <path d="M2 12h20"></path>
            <path d="M12 2v20"></path>
          </svg>
        </div>
        <div>
          <h1 class="tool-page-title">Blur Sensitive Information</h1>
          <p class="tool-page-subtitle">Select areas to blur faces, text, or numbers before sharing.</p>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp"/>
        <span class="drop-zone-icon">😶🌫️</span>
        <h3>Drop your image here</h3>
        <p>Your photo never leaves your device</p>
        <button class="btn-browse" type="button" onclick="document.getElementById('fileInput').click()">Browse Image</button>
      </div>

      <div class="action-panel" id="actionPanel" style="display:none;">
        <div class="blur-workspace">
          <div class="blur-toolbar">
            <button class="tool-btn active" id="modeBlur">💧 Blur Area</button>
            <button class="tool-btn" id="modePixelate">⬛ Pixelate Area</button>
            <div class="slider-wrap" style="margin-left:auto;">
              <label for="intensitySlider">Intensity</label>
              <input type="range" id="intensitySlider" min="5" max="50" value="20"/>
            </div>
            <button class="tool-btn" id="undoBtn">↩️ Undo</button>
            <button class="tool-btn" id="resetBtn">🔄 Start Over</button>
          </div>
          <div class="blur-canvas-container" id="canvasContainer">
            <canvas id="blurCanvas"></canvas>
          </div>
        </div>
        
        <div class="result-panel" id="resultPanel" style="margin-top:20px;display:none;">
          <h4>✅ Image Ready!</h4>
          <div class="result-actions">
            <button class="btn-primary" id="downloadBtn" style="width:auto">⬇️ Download Image</button>
            <button class="btn-secondary" id="closeBtn">Blur Another Image</button>
          </div>
        </div>

        <button class="btn-primary" id="saveBtn" style="margin-top:20px;">💾 Save Changes</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a href="../index.html" class="nav-logo" style="font-size:0.9rem;">File<span class="logo-accent">Forge</span></a>
        <p class="footer-copy">All processing done locally in your browser.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/app.js"></script>
  <script src="../js/pdfUtils.js"></script>
  <script src="../js/tools/blurImage.js"></script>
</body>
</html>
