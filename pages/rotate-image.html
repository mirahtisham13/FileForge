    .rotate-controls {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;

    .rotate-btn {
      padding: 10px 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all var(--transition);
    }
    .rotate-btn:hover { border-color: var(--accent); color: var(--accent); }
    .rotate-btn-icon { font-size: 1.2rem; }
    
    .rotate-preview-area {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; min-height: 300px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #previewImg {
      max-width: 100%; max-height: 400px; transition: transform 0.3s ease;
      object-fit: contain;
    }
